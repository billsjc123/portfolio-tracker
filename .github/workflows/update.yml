name: Update Portfolio

on:
  # 工作日 北京时间 09:00 和 17:00
  # 北京时间 = UTC + 8
  schedule:
    - cron: '0 1 * * 1-5'   # 北京 09:00
    - cron: '0 9 * * 1-5'   # 北京 17:00
  workflow_dispatch:        # 允许手动触发

# 防止并发：同一时间只能跑一个
concurrency:
  group: portfolio-update
  cancel-in-progress: false

permissions:
  contents: write     # 推 commit 回 main
  pages: write        # 部署 Pages
  id-token: write     # OIDC

jobs:
  update:
    name: 抓取行情并更新
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run portfolio update
        run: node scripts/update-portfolio.js
        env:
          NODE_OPTIONS: --unhandled-rejections=strict

      - name: Commit & push history snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/portfolio-history-main.json output/portfolio-history-aw.json output/last-run.json
          if git diff --staged --quiet; then
            echo "无变化，跳过 commit"
          else
            git commit -m "chore: update portfolio snapshots $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

  deploy:
    name: 部署 GitHub Pages
    runs-on: ubuntu-latest
    needs: update
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
