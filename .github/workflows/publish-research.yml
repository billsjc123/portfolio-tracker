name: Render company research

on:
  push:
    branches: [main]
    paths:
      - 'docs/research/**'
      - 'data/dashboard.template.html'
      - 'scripts/company-research.js'
      - 'scripts/render-dashboard.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-dashboard-update
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run render
      - run: npm run check
      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/portfolio-dashboard.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: render company research"
            git push
          fi
