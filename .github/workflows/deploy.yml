name: Deploy to GitHub Pages

on:
  # 本地 launchd 跑完后 push 上来，自动部署
  # 数据更新由本机 launchd 调度（~/Library/LaunchAgents/com.bill.portfolio-tracker.plist）
  push:
    branches: [main]
    paths:
      - 'output/portfolio-dashboard.html'
      - 'output/index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

# 改用 gh-pages 分支直接推送，绕开 GitHub Pages 部署 API
# 这样 GITHUB_TOKEN 默认的 contents: write 权限就够了，
# 不再依赖 Pages 写权限（避免 visibility 变更后 Pages 站点丢失的问题）
permissions:
  contents: write

jobs:
  deploy:
    name: 部署到 gh-pages 分支
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备部署文件
        run: |
          # 添加 .nojekyll 文件，让 GitHub Pages 不走 Jekyll 处理
          # 避免下划线开头的文件被忽略
          touch output/.nojekyll

      - name: 推送到 gh-pages 分支
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: output
          clean: true
          single-commit: true
          git-config-name: 'github-actions[bot]'
          git-config-email: 'github-actions[bot]@users.noreply.github.com'
