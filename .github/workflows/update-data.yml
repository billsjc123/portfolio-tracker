name: 更新 portfolio 行情快照

on:
  # 工作日北京时间 9:00 / 17:00（= UTC 01:00 / 09:00）
  schedule:
    - cron: '0 1,9 * * 1-5'
  # 手动触发（手机端 Actions 页面点 Run workflow）
  workflow_dispatch:
  # 持仓/交易/脚本变了 → 立即抓一次
  push:
    branches: [main]
    paths:
      - 'data/portfolio-config.json'
      - 'data/portfolio-trades.json'
      - 'scripts/**'

# 防止上一次还在跑时又被新触发打断
concurrency:
  group: portfolio-update
  cancel-in-progress: true

# 推 main 需要的写权限
permissions:
  contents: write

jobs:
  update:
    name: 抓行情 + 写 JSON + 推 main
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 抓行情 + 渲染 dashboard
        run: node scripts/update-portfolio.js

      - name: 提交并推送
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output/portfolio-history-main.json \
                  output/portfolio-history-aw.json \
                  output/portfolio-dashboard.html \
                  output/index.html \
                  output/last-run.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无变化，跳过 commit"
            exit 0
          fi
          git commit -m "chore: update portfolio $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin main
