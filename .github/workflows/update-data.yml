name: Update portfolio dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1-5"
    - cron: "0 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: portfolio-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update
      - run: npm run check
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data public-research
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update portfolio dashboard"
            git push
          fi

